name: Atualizar e publicar Wheelsys Rate Shop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/index.template.html"
      - "public/rate-shop.html"
      - "public/data/rateshop-history.json"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-rates.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wheelsys-rate-shop
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      SHAREPOINT_DRIVE_ID: b!xwmEBgEH00ujiRgMsJd2Yv53BYWpg_FEgcR3FtNZmn4HGYIuutM5S5XGcFz-a35B
      SHAREPOINT_FOLDER_PATH: Comercial/Brokers/Rates/Tarifas/files 2027

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sincronizar main
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Sincronizar tarifas do SharePoint
        run: python scripts/sync_sharepoint.py

      - name: Gerar tarifas e HTML
        run: python scripts/build_all.py

      - name: Atualizar historico Rate Shop
        shell: bash
        run: |
          if [ -f scripts/update_rateshop_history.py ]; then
            python scripts/update_rateshop_history.py
          else
            echo "Script update_rateshop_history.py nao encontrado; historico existente sera mantido."
          fi

      - name: Guardar ficheiros gerados e manifestos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html public/data/rates.json

          if [ -f public/data/rateshop-history.json ]; then
            git add public/data/rateshop-history.json
          fi
          if [ -f selection_manifest.json ]; then
            git add selection_manifest.json
          fi
          if [ -f build_manifest.json ]; then
            git add build_manifest.json
          fi
          if [ -f sharepoint_sync_manifest.json ]; then
            git add sharepoint_sync_manifest.json
          fi

          if git diff --cached --quiet; then
            echo "Sem alteracoes nos ficheiros gerados."
          else
            git commit -m "Atualizar tarifas e historico Rate Shop"
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verificar ficheiros do site
        shell: bash
        run: |
          test -f public/index.html
          test -f public/rate-shop.html
          test -f public/data/rates.json
          test -f public/data/rateshop-history.json
          test -f selection_manifest.json
          test -f build_manifest.json
          test -f sharepoint_sync_manifest.json

      - name: Carregar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
