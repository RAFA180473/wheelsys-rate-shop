name: Atualizar e publicar Wheelsys Rate Shop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/incoming/**"
      - "public/index.template.html"
      - "public/data/rateshop-history.json"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-rates.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wheelsys-rate-shop
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Gerar tarifas e HTML
        run: python scripts/build_all.py

      - name: Atualizar catalogo Rate Shop
        run: python scripts/update_rateshop_history.py

      - name: Guardar ficheiros gerados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html public/data/rates.json public/data/rateshop-history.json

          if git diff --cached --quiet; then
            echo "Sem alteracoes nos ficheiros gerados."
          else
            git commit -m "Atualizar tarifas e historico Rate Shop"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verificar ficheiros do site
        shell: bash
        run: |
          test -f public/index.html
          test -f public/data/rates.json
          test -f public/data/rateshop-history.json

      - name: Carregar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
